[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgvc"
version = "1.0.0"
description = "Hand Gesture Volume Controller using Python and computer vision."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "mediapipe",
    "numpy",
    "pynput",
]

[project.scripts]
hgvc = "main:main"

[tool.setuptools]
py-modules = ["main"]
